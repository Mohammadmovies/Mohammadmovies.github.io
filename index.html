<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mohammad’s flavour drinks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Signika:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange: #FCAF50;
      --mint: #A8E6CF;
      --white: #FFFFFF;
      --text: #1a1a1a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Signika', sans-serif;
      background-color: var(--white);
      color: var(--text);
      overflow-x: hidden;
    }

    /* --- Advanced Animations --- */
    @keyframes morph {
      0% { border-radius: 40% 60% 70% 30% / 40% 40% 60% 50%; }
      34% { border-radius: 70% 30% 50% 50% / 30% 30% 70% 70%; }
      67% { border-radius: 100% 60% 60% 100% / 100% 100% 60% 60%; }
      100% { border-radius: 40% 60% 70% 30% / 40% 40% 60% 50%; }
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    @keyframes slideUpFade {
      0% { opacity: 0; transform: translateY(50px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* --- Navigation --- */
    nav {
      position: fixed;
      width: 100%;
      top: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 1.5rem 2rem;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--mint);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-dot {
      width: 12px;
      height: 12px;
      background: var(--orange);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    /* --- Hero Section --- */
    .hero {
      min-height: 100vh;
      background-color: var(--mint);
      display: flex;
      align-items: center;
      padding: 6rem 2rem 2rem;
      position: relative;
      overflow: hidden;
    }

    .hero-content {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: center;
      position: relative;
      z-index: 2;
    }

    .hero-text {
      animation: slideUpFade 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .hero h1 {
      font-size: clamp(3.5rem, 8vw, 6.5rem);
      line-height: 1;
      font-weight: 700;
      margin-bottom: 1.5rem;
      letter-spacing: -2px;
      color: var(--text);
    }

    .hero p {
      font-size: clamp(1.5rem, 3vw, 2.5rem);
      font-weight: 600;
      color: var(--text);
      opacity: 0.9;
    }

    /* Liquid Drink Graphic */
    .hero-graphic {
      position: relative;
      width: 100%;
      height: 500px;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: slideUpFade 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
      opacity: 0;
    }

    .liquid-blob {
      width: 400px;
      height: 400px;
      background: var(--orange);
      box-shadow: inset 20px 20px 40px rgba(255, 255, 255, 0.4),
                  0 20px 50px rgba(252, 175, 80, 0.5);
      animation: morph 8s ease-in-out infinite, spin 20s linear infinite;
      position: absolute;
    }

    .liquid-blob::after {
      content: '';
      position: absolute;
      top: 10%;
      left: 10%;
      width: 80%;
      height: 80%;
      background: var(--white);
      border-radius: 50%;
      opacity: 0.2;
      animation: morph 6s ease-in-out infinite reverse;
    }

    /* --- Marquee Section --- */
    .marquee-container {
      background: var(--orange);
      padding: 1.5rem 0;
      overflow: hidden;
      white-space: nowrap;
      border-top: 4px solid var(--text);
      border-bottom: 4px solid var(--text);
      position: relative;
      z-index: 10;
      transform: rotate(-2deg);
      margin: -2rem -1rem 4rem -1rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .marquee-track {
      display: inline-block;
      animation: marquee 15s linear infinite;
    }

    .marquee-text {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--text);
      text-transform: uppercase;
      padding: 0 2rem;
    }

    /* --- Menu Section --- */
    .menu-section {
      max-width: 1200px;
      margin: 6rem auto;
      padding: 0 2rem;
    }

    .menu-section h2 {
      font-size: clamp(2.5rem, 5vw, 4rem);
      text-transform: uppercase;
      letter-spacing: -1
